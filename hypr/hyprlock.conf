general {
    hide_cursor = 1
    ignore_empty_input = 1
}

bezier = glass, 0.16, 1, 0.3, 1
animation = fadeIn, 1, 5, glass
animation = fadeOut, 1, 4, glass
animation = inputFieldColors, 1, 3, glass
animation = inputFieldFade, 1, 3, glass
animation = inputFieldWidth, 1, 5, glass
animation = inputFieldDots, 1, 3, glass

background {
    monitor =
    path = screenshot

    blur_passes = 3
    blur_size = 5
    noise = 0.015
    contrast = 1.10
    brightness = 1.02
    vibrancy = 0.5
}

label {
    monitor =
    text = cmd[update:60000] ~/.config/hypr/scripts/greeting.sh
    color = rgba(255, 255, 255, 0.7)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    shadow_passes = 1
    position = 0, 225
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +'%H:%M')</b>"
    color = rgba(255, 255, 255, 0.95)
    font_size = 90
    font_family = JetBrainsMono Nerd Font Bold
    shadow_passes = 3
    shadow_size = 8
    position = 0, 130
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(LC_TIME=C date +'%A %d %B %Y')"
    color = rgba(255, 255, 255, 0.8)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    shadow_passes = 1
    position = 0, 45
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 52
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.2
    dots_center = true

    outer_color = rgba(255, 255, 255, 0.5)
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = rgb(255, 255, 255)
    fade_on_empty = false
    rounding = -1

    check_color = rgba(0, 255, 200, 0.8)
    fail_color = rgba(255, 80, 80, 0.8)
    capslock_color = rgba(255, 200, 0, 0.8)

    placeholder_text = <span foreground="##ffffffaa"><i>Password...</i></span>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    check_text = <i>Checking...</i>

    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.25)

    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT
    color = rgba(255, 255, 255, 0.5)
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 0, -112
    halign = center
    valign = center
}

shape {
    monitor =
    size = 300, 140
    color = rgba(255, 255, 255, 0.08)
    border_size = 2
    border_color = rgba(255, 255, 255, 0.35)
    rounding = 16
    shadow_passes = 3
    shadow_size = 10
    shadow_color = rgba(0, 0, 0, 0.25)
    position = 60, -60
    halign = left
    valign = center
}

shape {
    monitor =
    size = 268, 2
    color = rgba(255, 255, 255, 0.3)
    rounding = 1
    position = 76, 6
    halign = left
    valign = center
}

label {
    monitor =
    text = cmd[update:2000] ~/.config/hypr/scripts/system_monitor.sh
    color = rgba(255, 255, 255, 0.9)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 80, -60
    halign = left
    valign = center
}

shape {
    monitor =
    size = 320, 140
    color = rgba(255, 255, 255, 0.08)
    border_size = 2
    border_color = rgba(255, 255, 255, 0.35)
    rounding = 16
    shadow_passes = 3
    shadow_size = 10
    shadow_color = rgba(0, 0, 0, 0.25)
    position = -60, -60
    halign = right
    valign = center
}

shape {
    monitor =
    size = 288, 2
    color = rgba(255, 255, 255, 0.3)
    rounding = 1
    position = -76, 6
    halign = right
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/scripts/now_playing.sh
    color = rgba(255, 255, 255, 0.95)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = -80, -60
    halign = right
    valign = center
}
